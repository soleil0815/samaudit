# SAMAUDIT – docker-compose.yml
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Installation:  put this file and .env.example into an empty folder (e.g. /opt/samaudit),
#                cp .env.example .env, fill in .env (at least DOMAIN_FQDN), docker compose up -d
# Update:        container manager (Dockhand, Watchtower, Tugtainer …) or
#                docker compose pull && docker compose up -d     (or: sh update.sh)
# Version:       SAMAUDIT_VERSION in .env (default: latest)
#
# Please do NOT edit this file – it may be replaced on update. Own additions (DNS servers,
# fixed host entries, other paths) go into docker-compose.override.yml in the same folder;
# Compose reads it automatically. Example:
#
#   services:
#     samaudit:
#       dns: [10.0.10.10, 10.0.10.11]
#       extra_hosts: ["dc01.firma.local:10.0.10.10", "dc02.firma.local:10.0.10.11"]
#
# Container managers without an override file (e.g. a stack in Dockhand/Portainer): paste the
# content and replace the paths ./data and ./certs with your data folder, e.g. /opt/samaudit/data.
# Portainer stores a stack's environment variables as "stack.env": use env_file: stack.env there.

name: samaudit

services:
  samaudit:
    image: ${SAMAUDIT_IMAGE:-ghcr.io/soleil0815/samaudit}:${SAMAUDIT_VERSION:-latest}
    container_name: samaudit
    hostname: samaudit
    restart: unless-stopped
    env_file: .env
    environment:
      SAMAUDIT_COMPOSE: "1"        # version of this file – do not change
      PORT: "9400"                 # always 9400 inside the container; the outside port is PORT in .env
    ports:
      - "${PORT:-9400}:9400"
    volumes:
      - ./data:/app/data           # database, backups (data/backups), web UI certificates
      - ./certs:/app/certs:ro      # optional: your own HTTPS certificate
    networks:
      - samaudit-net
    # hardening – do not remove
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                       # only for start-up: hand ./data to the program user, then switch
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  samaudit-net:
    name: samaudit-net
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-samaudit
