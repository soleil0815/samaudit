# SAMAUDIT – docker-compose.yml
#
# Installation:  diese Datei und .env.example in einen leeren Ordner legen (z. B. /opt/samaudit),
#                cp .env.example .env, .env ausfüllen (mindestens DOMAIN_FQDN), docker compose up -d
# Update:        Container-Verwaltung (Dockhand, Watchtower, Tugtainer …) oder
#                docker compose pull && docker compose up -d     (oder: sh update.sh)
# Version:       SAMAUDIT_VERSION in der .env (Standard: latest)
#
# Installation:  put this file and .env.example into an empty folder (e.g. /opt/samaudit),
#                cp .env.example .env, fill in .env (at least DOMAIN_FQDN), docker compose up -d
# Update:        container manager (Dockhand, Watchtower, Tugtainer …) or
#                docker compose pull && docker compose up -d     (or: sh update.sh)
# Version:       SAMAUDIT_VERSION in .env (default: latest)
#
# Diese Datei bitte NICHT ändern – sie kann bei einem Update ersetzt werden. Eigene Ergänzungen
# (DNS-Server, feste Host-Einträge, andere Pfade) gehören in docker-compose.override.yml im selben
# Ordner; Compose liest sie automatisch mit. Beispiel:
# Please do NOT edit this file – it may be replaced on update. Own additions (DNS servers,
# fixed host entries, other paths) go into docker-compose.override.yml in the same folder;
# Compose reads it automatically. Example:
#
#   services:
#     samaudit:
#       dns: [10.0.10.10, 10.0.10.11]
#       extra_hosts: ["dc01.firma.local:10.0.10.10", "dc02.firma.local:10.0.10.11"]
#
# Container-Verwaltung ohne Override-Datei (z. B. Stack in Dockhand/Portainer): Inhalt einfügen und
# die Pfade ./data und ./certs durch den Datenordner ersetzen, z. B. /opt/samaudit/data.
# Portainer speichert die Umgebungsvariablen eines Stacks als „stack.env“: dort env_file: stack.env eintragen.
# Container managers without an override file (e.g. a stack in Dockhand/Portainer): paste the
# content and replace the paths ./data and ./certs with your data folder, e.g. /opt/samaudit/data.
# Portainer stores a stack's environment variables as "stack.env": use env_file: stack.env there.

name: samaudit

services:
  samaudit:
    image: ${SAMAUDIT_IMAGE:-ghcr.io/soleil0815/samaudit}:${SAMAUDIT_VERSION:-latest}
    container_name: samaudit
    hostname: samaudit
    restart: unless-stopped
    env_file: .env
    environment:
      SAMAUDIT_COMPOSE: "1"        # Version dieser Datei / version of this file – nicht ändern
      PORT: "9400"                 # im Container immer 9400; nach außen gilt PORT aus der .env
    ports:
      - "${PORT:-9400}:9400"
    volumes:
      - ./data:/app/data           # Datenbank, Sicherungen (data/backups), Zertifikate der Oberfläche
      - ./certs:/app/certs:ro      # optional: eigenes HTTPS-Zertifikat / own HTTPS certificate
    networks:
      - samaudit-net
    # Sicherheit – entspricht dem bisherigen Start durch update.sh / security – do not remove
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                       # nur für den Start: ./data dem Programmbenutzer geben, dann Wechsel
      - CHOWN                      # only for start-up: hand ./data to the program user, then switch
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  samaudit-net:
    name: samaudit-net
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-samaudit
