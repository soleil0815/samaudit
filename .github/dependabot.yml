# Keeps the GitHub Actions used by the workflow up to date (security fixes of actions).
# Dependabot pull requests are never merged automatically – the owner reviews and merges them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # cooldown: only suggest action releases that are at least a week old (a hijacked release is usually
    # withdrawn within days – see tj-actions/changed-files 2025)
    cooldown:
      default-days: 7
