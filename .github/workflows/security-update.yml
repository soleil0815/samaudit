# SPDX-License-Identifier: AGPL-3.0-or-later
# Monthly security update on patch day – same program, newer packages, published as "<version>-s<n>".
#
#   Patch day = the second Tuesday of the month (like Microsoft's Patch Tuesday, the same day in all programs),
#   03:17 UTC; manually at any time: Actions -> Security update -> Run workflow. The schedule starts every Tuesday,
#   tools/patchday.sh only lets the second one through (a cron line cannot say "second Tuesday").
#   1. update all locks WITHIN the base (tools/update-locks.sh): same Python series, same Debian
#      release, every package within its major version (0.x: minor); calendar versions unlimited
#   2. nothing changed -> stop, nothing is published
#   3. build without cache, tests inside the image, Trivy (fixable HIGH/CRITICAL blocks)
#   4. only if everything passed: commit the locks + change log (pushed to main at the end), build and
#      check amd64 and arm64 at the same time, each on its own runner (no emulation), publish
#      <version>-s<n> (and latest if it is the highest version), git tag + GitHub release
#   A failure publishes nothing; the reason is shown at the run (annotation + summary).
#
#   Separately every Monday (job base-support): how long do Python and Debian still get security updates
#   (endoflife.date)? Less than 12 months: hint; less than 6 months: red run.
name: Security update

on:
  schedule:
    - cron: "17 3 * * 2"     # Tuesdays 03:17 UTC: security update, only on patch day (job patchday)
    - cron: "17 3 * * 1"     # Mondays 03:17 UTC: base support check only
  workflow_dispatch:

permissions: {}

jobs:
  base-support:
    # end of security support of the base (Python series, Debian release) – Mondays and by hand
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Support periods (endoflife.date)
        shell: bash
        run: |
          set -uo pipefail
          . tools/lock-policy.env
          rc=0
          for spec in "python $PYTHON_SERIES" "debian $DEBIAN_RELEASE"; do
            set -- $spec
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/$1.json" "https://endoflife.date/api/v1/products/$1/releases/$2" \
              || curl -sSfL --retry 3 -o "$RUNNER_TEMP/$1.json" "https://endoflife.date/api/$1/$2.json" || true
            python3 tools/lockutil.py eol "$1" "$2" "$RUNNER_TEMP/$1.json" | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          done
          exit $rc

  patchday:
    # scheduled: only the Tuesday run on patch day goes on; by hand: any day
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * 2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/patchday.sh
          sparse-checkout-cone-mode: false
      - name: Patch day?
        id: check
        shell: sh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ] || sh tools/patchday.sh; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security update::Not patch day – the security update runs on the second Tuesday of the month."
          fi

  prepare:
    # new locks within the base, build without cache, tests in the image, Trivy
    needs: patchday
    if: needs.patchday.outputs.due == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.locks.outputs.changed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: locks
        name: Update locks within the base (build without cache)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" && git archive HEAD | tar -x -C "$RUNNER_TEMP/old"
          if ! tools/update-locks.sh > "$RUNNER_TEMP/locks.log" 2>&1; then
            tail -30 "$RUNNER_TEMP/locks.log"
            echo "::error title=Security update: versions not determinable::tools/update-locks.sh failed (details in the log of this step)."
            exit 1
          fi
          cat "$RUNNER_TEMP/locks.log"
          python3 tools/lockutil.py diff "$RUNNER_TEMP/old" . > "$RUNNER_TEMP/changes.md"
          if [ -s "$RUNNER_TEMP/changes.md" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "## Changed packages"; cat "$RUNNER_TEMP/changes.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new packages within the base – nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: verify
        name: Tests inside the image
        if: steps.locks.outputs.changed == 'true'
        run: .github/scripts/verify-image.sh samaudit:candidate
      - id: trivy
        name: Vulnerability scan (Trivy)
        if: steps.locks.outputs.changed == 'true'
        run: .github/scripts/trivy.sh samaudit:candidate
      - id: upload
        name: Hand over the new locks
        if: steps.locks.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-locks
          path: |
            Dockerfile
            requirements.txt
            requirements-dev.txt
            locks/os-packages.txt
          retention-days: 7
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: ${{ runner.temp }}/trivy-report/
          retention-days: 30
          if-no-files-found: ignore

  number:
    # only if prepare passed completely and something changed: number + local commit of locks and change log
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Take over the new locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: new-locks
          path: .
      - id: version
        name: Security update number
        shell: bash
        run: |
          set -euo pipefail
          app="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)"
          mapfile -t tags < <(git tag -l 'v*')
          version="$(python3 tools/lockutil.py next-version "$app" "${tags[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Security update $version (program $app)" >> "$GITHUB_STEP_SUMMARY"
      - id: commit
        name: Commit locks and change log (local, pushed after publishing)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" && git archive HEAD | tar -x -C "$RUNNER_TEMP/old"
          python3 tools/lockutil.py diff "$RUNNER_TEMP/old" . > "$RUNNER_TEMP/changes.md"
          [ -s "$RUNNER_TEMP/changes.md" ] || { echo "::error title=Security update::No changes compared to main."; exit 1; }
          app="${VERSION%-s*}"
          {
            echo "## $VERSION – $(date -u +%Y-%m-%d)"
            echo
            echo "Same program ($app), updated packages only."
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
          } > "$RUNNER_TEMP/entry.md"
          python3 - "$RUNNER_TEMP/entry.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path("CHANGELOG-SECURITY.md")
          entry = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          text = p.read_text(encoding="utf-8")
          marker = "<!-- entries -->\n"
          assert marker in text, "marker missing in CHANGELOG-SECURITY.md"
          p.write_text(text.replace(marker, marker + "\n" + entry, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile requirements.txt requirements-dev.txt locks/os-packages.txt CHANGELOG-SECURITY.md
          git commit -q -m "Security update $VERSION: updated packages" -m "Same program, newer package versions (see CHANGELOG-SECURITY.md)."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Hand over the commit (exactly this commit is built on both platforms and pushed later)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handover"
          git bundle create "$RUNNER_TEMP/handover/release.bundle" "$GITHUB_SHA..HEAD"
          cp "$RUNNER_TEMP/entry.md" "$RUNNER_TEMP/handover/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/handover/
          retention-days: 7

  platform:
    # each platform on its own hardware, both at the same time (no emulation): build without cache, push
    # untagged, check (locks, tests in the image, Trivy)
    needs: number
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write      # ghcr.io (untagged until both platforms passed)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/handover
      - name: The commit of this security update
        shell: bash
        env:
          SHA: ${{ needs.number.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch -q "$RUNNER_TEMP/handover/release.bundle" HEAD
          git checkout -q --detach "$SHA"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: check
        name: Build without cache, push untagged, check (${{ matrix.arch }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.number.outputs.version }}
          REVISION: ${{ needs.number.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          .github/scripts/publish-image.sh build "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          retention-days: 1
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ matrix.arch }}
          path: ${{ runner.temp }}/trivy-report/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    # both platforms passed: image files, tags, locks + change log to main, git tag + GitHub release
    needs: [number, platform]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit locks + change log, git tag + GitHub release
      packages: write      # ghcr.io
    concurrency:
      group: release       # shared with docker-image.yml: never two publications at once
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/handover
      - id: version
        name: Security update number and commit
        shell: bash
        env:
          VERSION: ${{ needs.number.outputs.version }}
          SHA: ${{ needs.number.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch -q "$RUNNER_TEMP/handover/release.bundle" HEAD
          git checkout -q --detach "$SHA"
          cp "$RUNNER_TEMP/handover/entry.md" "$RUNNER_TEMP/entry.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: commit
        name: Commit of this security update
        shell: bash
        env:
          SHA: ${{ needs.number.outputs.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Checked digests of both platforms
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true
      - id: publish
        name: Image files and tags (both platforms)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          .github/scripts/publish-image.sh tag "$VERSION" "$RUNNER_TEMP/digest"
      - id: release
        name: Git tag, main and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # one-time auth header – no Git credentials are stored in the checkout
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          push() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push -q origin "$@"; }
          push "$SHA:refs/tags/v$VERSION"
          push "$SHA:refs/heads/main" \
            || echo "::warning title=main not updated::main has changed in the meantime. Release v$VERSION is published; the next run takes over the package versions."
          { tail -n +2 "$RUNNER_TEMP/entry.md"; echo; echo "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\` – update: container manager or \`docker compose pull && docker compose up -d\`"; echo; echo "Without internet: download the matching image file and SHA256SUMS, then \`sh update.sh --load <file>\`."; } > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SAMAUDIT $VERSION (security update)" --notes-file notes.md \
            "$RUNNER_TEMP"/release-assets/*
