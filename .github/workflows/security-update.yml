# SPDX-License-Identifier: AGPL-3.0-or-later
# Weekly security update – same program, newer packages, published as "<version>-s<n>".
#
#   Mondays 03:17 UTC (and manually: Actions -> Security update -> Run workflow)
#   1. update all locks WITHIN the base (tools/update-locks.sh): same Python series, same Debian
#      release, every package within its major version (0.x: minor); calendar versions unlimited
#   2. nothing changed -> stop, nothing is published
#   3. build without cache, tests inside the image, Trivy (fixable HIGH/CRITICAL blocks)
#   4. only if everything passed: commit the locks + change log to main, build/check/publish
#      <version>-s<n> (and latest if it is the highest version), git tag + GitHub release
#   A failure publishes nothing; the reason is shown at the run (annotation + summary).
#
#   Separately every week: how long do Python and Debian still get security updates
#   (endoflife.date)? Less than 12 months: hint; less than 6 months: red run.
name: Security update

on:
  schedule:
    - cron: "17 3 * * 1"     # Mondays 03:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  base-support:
    # end of security support of the base (Python series, Debian release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Support periods (endoflife.date)
        shell: bash
        run: |
          set -uo pipefail
          . tools/lock-policy.env
          rc=0
          for spec in "python $PYTHON_SERIES" "debian $DEBIAN_RELEASE"; do
            set -- $spec
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/$1.json" "https://endoflife.date/api/v1/products/$1/releases/$2" \
              || curl -sSfL --retry 3 -o "$RUNNER_TEMP/$1.json" "https://endoflife.date/api/$1/$2.json" || true
            python3 tools/lockutil.py eol "$1" "$2" "$RUNNER_TEMP/$1.json" | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          done
          exit $rc

  prepare:
    # new locks within the base, build without cache, tests in the image, Trivy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.locks.outputs.changed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: locks
        name: Update locks within the base (build without cache)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" && git archive HEAD | tar -x -C "$RUNNER_TEMP/old"
          if ! tools/update-locks.sh > "$RUNNER_TEMP/locks.log" 2>&1; then
            tail -30 "$RUNNER_TEMP/locks.log"
            echo "::error title=Sicherheitsupdate: Versionen nicht ermittelbar::tools/update-locks.sh ist fehlgeschlagen (Details im Log dieses Schritts)."
            exit 1
          fi
          cat "$RUNNER_TEMP/locks.log"
          python3 tools/lockutil.py diff "$RUNNER_TEMP/old" . > "$RUNNER_TEMP/changes.md"
          if [ -s "$RUNNER_TEMP/changes.md" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "## Geänderte Pakete"; cat "$RUNNER_TEMP/changes.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen Pakete innerhalb des Unterbaus – nichts zu tun." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: verify
        name: Tests inside the image
        if: steps.locks.outputs.changed == 'true'
        run: .github/scripts/verify-image.sh samaudit:candidate
      - id: trivy
        name: Vulnerability scan (Trivy)
        if: steps.locks.outputs.changed == 'true'
        run: .github/scripts/trivy.sh samaudit:candidate
      - id: upload
        name: Hand over the new locks
        if: steps.locks.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-locks
          path: |
            Dockerfile
            requirements.txt
            requirements-dev.txt
            locks/os-packages.txt
          retention-days: 7
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: ${{ runner.temp }}/trivy-report/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    # only if prepare passed completely and something changed
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit locks + change log, git tag + GitHub release
      packages: write      # ghcr.io
    concurrency:
      group: release       # shared with docker-image.yml: never two publications at once
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Take over the new locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: new-locks
          path: .
      - id: version
        name: Security update number
        shell: bash
        run: |
          set -euo pipefail
          app="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)"
          mapfile -t tags < <(git tag -l 'v*')
          version="$(python3 tools/lockutil.py next-version "$app" "${tags[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Sicherheitsupdate $version (Programm $app)" >> "$GITHUB_STEP_SUMMARY"
      - id: commit
        name: Commit locks and change log (local, pushed after publishing)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" && git archive HEAD | tar -x -C "$RUNNER_TEMP/old"
          python3 tools/lockutil.py diff "$RUNNER_TEMP/old" . > "$RUNNER_TEMP/changes.md"
          [ -s "$RUNNER_TEMP/changes.md" ] || { echo "::error title=Sicherheitsupdate::Keine Änderungen gegenüber main."; exit 1; }
          app="${VERSION%-s*}"
          {
            echo "## $VERSION – $(date -u +%Y-%m-%d)"
            echo
            echo "Gleiches Programm ($app), nur aktualisierte Pakete."
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
          } > "$RUNNER_TEMP/entry.md"
          python3 - "$RUNNER_TEMP/entry.md" <<'PY'
          import sys, pathlib
          p = pathlib.Path("CHANGELOG-SECURITY.md")
          entry = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          text = p.read_text(encoding="utf-8")
          marker = "<!-- entries -->\n"
          assert marker in text, "marker missing in CHANGELOG-SECURITY.md"
          p.write_text(text.replace(marker, marker + "\n" + entry, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile requirements.txt requirements-dev.txt locks/os-packages.txt CHANGELOG-SECURITY.md
          git commit -q -m "Security update $VERSION: updated packages" -m "Same program, newer package versions (see CHANGELOG-SECURITY.md)."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: publish
        name: Build without cache, check, publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          .github/scripts/publish-image.sh "$VERSION"
      - id: release
        name: Git tag, main and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # one-time auth header – no Git credentials are stored in the checkout
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          push() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push -q origin "$@"; }
          push "$SHA:refs/tags/v$VERSION"
          push "$SHA:refs/heads/main" \
            || echo "::warning title=main nicht aktualisiert::main hat sich inzwischen geändert. Das Release v$VERSION ist veröffentlicht; die Paketstände übernimmt der nächste Lauf."
          { tail -n +2 "$RUNNER_TEMP/entry.md"; echo; echo "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\` – Update: Container-Verwaltung oder \`docker compose pull && docker compose up -d\`"; echo; echo "Ohne Internet: passende Image-Datei und SHA256SUMS herunterladen, dann \`sh update.sh --load <Datei>\`."; } > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SAMAUDIT $VERSION (Sicherheitsupdate)" --notes-file notes.md \
            "$RUNNER_TEMP"/release-assets/*
