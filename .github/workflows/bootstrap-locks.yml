# TEMPORARY – recomputes the lock files within the base and prints them as annotations (removed before merge)
name: Bootstrap locks
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  locks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute locks
        shell: bash
        run: |
          if ! tools/update-locks.sh > "$RUNNER_TEMP/log" 2>&1; then
            python3 -c "import sys; t=open(sys.argv[1]).read()[-12000:]; print('::error title=LOG::' + t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))" "$RUNNER_TEMP/log"
            exit 1
          fi
      - name: Emit 0
        shell: bash
        run: |
          python3 - <<'PY2'
          import base64, gzip, io, tarfile
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w") as tf:
              for f in ["Dockerfile", "requirements.txt", "requirements-dev.txt", "locks/os-packages.txt"]:
                  tf.add(f)
          data = base64.b64encode(gzip.compress(buf.getvalue(), 9, mtime=0)).decode()
          chunks = [data[i:i + 3800] for i in range(0, len(data), 3800)]
          if 0 == 0:
              print(f"::notice title=COUNT::{len(chunks)}")
          for i in range(0 * 9, min(len(chunks), (0 + 1) * 9)):
              print(f"::notice title=B64 {i}::{chunks[i]}")
          PY2
