# Weekly vulnerability scan of the published image ghcr.io/<owner>/<repo>:latest.
#
# New vulnerabilities are found in images long after they were built. This workflow only REPORTS –
# it never rebuilds or publishes anything. The owner decides what happens next.
#
#   findings (CRITICAL/HIGH with an available fix)  -> GitHub issue "Sicherheitsscan …" (label security-scan)
#                                                      with the list, the owner is mentioned (notification);
#                                                      if the issue is already open, a comment is added
#   clean again                                      -> the open issue is closed automatically
#   scan itself failed                               -> issue/comment as well (nothing is assumed to be fine)
name: Security scan

on:
  schedule:
    - cron: "17 4 * * 1"     # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        id: img
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull --platform linux/amd64 "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Vulnerability scan (Trivy)
        id: scan
        continue-on-error: true
        run: .github/scripts/trivy.sh "${{ steps.img.outputs.image }}"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-latest
          path: ${{ runner.temp }}/trivy-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Report as GitHub issue (no rebuild)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/trivy-report"
          rc="$(cat "$report/rc" 2>/dev/null || echo 1)"
          label="security-scan"
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Findings of the weekly vulnerability scan" >/dev/null 2>&1 || true
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --json number --jq '.[0].number // empty')"

          if [ "$rc" = 0 ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
                --body "Erneuter Scan von \`$IMAGE\` ohne behebbare kritische/hohe Schwachstellen – erledigt. ([Lauf]($RUN_URL))"
              gh issue close "$open" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi

          {
            if [ "$rc" = 3 ]; then
              echo "Der wöchentliche Scan hat im veröffentlichten Image \`$IMAGE\` **kritische oder hohe Schwachstellen gefunden, für die es eine Korrektur gibt**."
              echo
              echo "Es wurde **nichts neu gebaut oder veröffentlicht** – bitte entscheiden, wie es weitergeht (z. B. Claude beauftragen, die Pakete zu aktualisieren)."
              echo
              echo '```'
              head -c 50000 "$report/blocking-list.txt" 2>/dev/null || true
              echo '```'
            else
              echo "Der wöchentliche Scan von \`$IMAGE\` ist **fehlgeschlagen** (Exit-Code $rc) – das Image konnte nicht geprüft werden."
            fi
            echo
            echo "Vollständiger Bericht: [Lauf]($RUN_URL) (Zusammenfassung und Artefakt \`trivy-report-latest\`)"
            echo
            echo "@$OWNER"
          } > body.md

          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            title="Sicherheitsscan: behebbare Schwachstellen im Image (latest)"
            [ "$rc" = 3 ] || title="Sicherheitsscan fehlgeschlagen (latest)"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$label" --body-file body.md
          fi
          exit 1     # mark the run as failed as well
