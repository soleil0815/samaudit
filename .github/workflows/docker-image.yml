# Builds the SAMAUDIT container image on GitHub and publishes it to the
# GitHub Container Registry: ghcr.io/<owner>/<repo>  (here: ghcr.io/soleil0815/samaudit)
#
#   push to main      -> tags: latest, <version from app/version.py>, sha-<commit>
#                        then the git tag v<version> and a GitHub release are created
#                        automatically (notes from app/docs/news.json), if not there yet
#   push tag v1.2.3   -> tag:  1.2.3   (the tag must match app/version.py)
#   pull request      -> build only (test), nothing is published
#   pull request from a branch claude/... of this repository (changes prepared by Claude):
#                        if the test build succeeds, it is merged automatically and the
#                        publish run above is started for main (latest, version, tag, release)
#
# Servers update with:  sh update.sh --pull
name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # only test builds of pull requests may be cancelled – a publish run must never stop half-way
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # smoke test without Docker and without a domain: rules on demo data, PDF, pages, parsers, pinning
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned packages
        run: |
          python -m pip install --no-deps --only-binary=:all: -r requirements.txt
          python -m pip check
      - name: Smoke test
        run: python tests/smoke.py

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read version and base image
        id: info
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)"
          base="$(sed -n 's/^ARG PYTHON_IMAGE=//p' Dockerfile | head -1)"
          # use the pinned digest from base-image.lock if it belongs to the same tag
          if [ -f base-image.lock ]; then
            lock="$(grep -v '^#' base-image.lock | head -1 | tr -d '[:space:]')"
            [ "${lock%%@*}" = "$base" ] && base="$lock"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF#refs/tags/v}" != "$version" ]; then
            echo "::error::Git tag ${GITHUB_REF#refs/tags/} does not match app/version.py ($version)"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # never overwrite a published version: if release v<version> exists, only latest/sha are pushed
          fresh=true
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && gh release view "v$version" >/dev/null 2>&1; then
            fresh=false
            echo "::warning::v$version is already released – the image tag $version is not overwritten (raise app/version.py)"
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          # What's new in the app: every release should have an entry in app/docs/news.json
          if ! grep -q "\"version\": \"$version\"" app/docs/news.json; then
            echo "::warning::app/docs/news.json has no entry for $version (shown in the app under \"What's new\")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base"       >> "$GITHUB_OUTPUT"
          echo "image=$image"     >> "$GITHUB_OUTPUT"
          echo "SAMAUDIT $version, base image $base -> $image"

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.info.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.info.outputs.version }},enable=${{ steps.info.outputs.fresh == 'true' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          # only these labels – the image's own OCI labels (title, version) stay as set in the Dockerfile
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PYTHON_IMAGE=${{ steps.info.outputs.base }}
            APP_VERSION=${{ steps.info.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # after a successful publish from main: tag v<version> + GitHub release (once per version)
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)"
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists - nothing to do"
            exit 0
          fi
          python3 - "$version" "${GITHUB_REPOSITORY,,}" > notes.md <<'PY'
          import json, sys
          v, repo = sys.argv[1], sys.argv[2]
          label = {"feature": "Funktion", "security": "Sicherheit", "fix": "Fehlerbehebung", "notice": "Hinweis"}
          entry = next((e for e in json.load(open("app/docs/news.json", encoding="utf-8")) if e.get("version") == v), None)
          for i in (entry or {}).get("items", []):
              print(f"- **{label.get(i.get('type'), 'Info')}:** {i.get('de') or i.get('en')}")
          print(f"\nImage: `ghcr.io/{repo}:{v}` (auch `latest`) – Update: `sh update.sh --pull`")
          PY
          gh release create "v$version" --target "$GITHUB_SHA" --title "SAMAUDIT $version" --notes-file notes.md

  automerge:
    # PRs from claude/... branches of this repository: merge after a green test build and publish.
    # A merge made with GITHUB_TOKEN does not trigger "push" workflows, so the publish run is
    # started explicitly via workflow_dispatch (which GITHUB_TOKEN is allowed to trigger).
    needs: [test, build]
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # merge exactly the commit that was tested and built – a later push is not merged blindly
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run docker-image.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "PR #$PR merged - publish run for main started"
