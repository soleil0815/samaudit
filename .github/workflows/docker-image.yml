# Program releases: builds, checks and publishes the container image ghcr.io/<owner>/<repo>.
#
#   pull request      -> self-tests, reproducible build, tests inside the image, Trivy – nothing published
#   pull request from a branch claude/... of this repository: after all checks pass it is merged
#                        automatically and this workflow is started for main
#   main (push / manual start) -> if app/version.py contains a NEW version: publish <version>
#                        (and latest if it is the highest version), then git tag + GitHub release.
#                        An existing version is never published again.
#
# Weekly security updates ("<version>-s<n>"): security-update.yml. Daily scan: scan-published.yml.
# All actions are pinned to commit hashes; every job has only the permissions it needs.
name: Container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # self-tests of the build/release machinery + smoke test of the program (no Docker, no domain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked packages
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Self-tests (schedule, step order, version bounds, Trivy flow)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Smoke test
        run: python tests/smoke.py

  build:
    # reproducible build from the lock files, checks inside the image, Trivy – nothing is published
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        name: Build image (amd64, from the lock files)
        run: docker build --pull -t samaudit-check:ci .
      - id: verify
        name: Check locks and run the tests inside the image
        run: .github/scripts/verify-image.sh samaudit-check:ci
      - id: trivy
        name: Vulnerability scan (Trivy)
        run: .github/scripts/trivy.sh samaudit-check:ci
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: ${{ runner.temp }}/trivy-report/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    # new program version on main: publish exactly once
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # git tag + GitHub release
      packages: write      # ghcr.io
    concurrency:
      group: release       # shared with security-update.yml: never two publications at once
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: version
        name: Version to publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nichts veröffentlicht::Version $version ist bereits veröffentlicht. Für ein neues Release app/version.py anheben."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU (arm64)
        if: steps.version.outputs.new == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        if: steps.version.outputs.new == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: publish
        name: Build without cache, check, publish
        if: steps.version.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          .github/scripts/publish-image.sh "$VERSION"
      - id: release
        name: Git tag and GitHub release
        if: steps.version.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" "${GITHUB_REPOSITORY,,}" > notes.md <<'PY'
          import json, sys
          v, repo = sys.argv[1], sys.argv[2]
          label = {"feature": "Funktion", "security": "Sicherheit", "fix": "Fehlerbehebung", "notice": "Hinweis"}
          entry = next((e for e in json.load(open("app/docs/news.json", encoding="utf-8")) if e.get("version") == v), None)
          for i in (entry or {}).get("items", []):
              print(f"- **{label.get(i.get('type'), 'Info')}:** {i.get('de') or i.get('en')}")
          print(f"\nImage: `ghcr.io/{repo}:{v}` – Update: `sh update.sh --pull`")
          PY
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SAMAUDIT $VERSION" --notes-file notes.md

  automerge:
    # PRs from claude/... branches of this repository: merge exactly the tested commit, then start
    # this workflow for main (a merge made with GITHUB_TOKEN does not trigger "push" workflows)
    needs: [test, build]
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge and start the release run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run docker-image.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "PR #$PR merged - release run for main started"
