# Configuration of the static checks (CI job "test"). The program itself is not a Python package.

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["app", "tests", "tools"]

[tool.ruff.lint]
# F: pyflakes (unused names, undefined names) · E9: syntax errors · B: bugbear (likely bugs)
# S: bandit security rules · BLE: blind "except Exception"
select = ["F", "E9", "B", "S", "BLE"]
ignore = [
    # try/except/pass and try/except/continue: only used for best-effort cleanup and optional
    # data (each such spot is marked "noqa: BLE001" with a reason); a failure there must not abort a scan.
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# Tests start subprocesses with fixed arguments, use temp paths and assert freely.
"tests/**" = ["S", "BLE001"]
# Demo mode: random numbers only build fake example data; the SHA-1 is part of a fake
# demo certificate whose weak signature the demo is meant to show as a finding.
"app/demo.py" = ["S311", "S303", "S324"]

[tool.mypy]
python_version = "3.13"
files = ["app", "run.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
